<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c])), money=n=>new Intl.NumberFormat('en-CA',{
  style:'currency',currency:'CAD'
}).format(n), localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, today=()=>localDate(new Date()), dateObj=s=>new Date(s+'T12:00:00'), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), num=v=>Number(v), sum=a=>a.reduce((s,x)=>s+x,0);
const defaults=()=>({
  transactions:[],university:[],semesters:[],courses:[],work:[],calendar:[],vehicle:[],knowledge:[],links:[],opening:0,theme:'light',budget:20,projection:12
});
let state=defaults(),storageOK=true,cloudReady=false,cloudSave=null;
let page='Home',edit=null,month=today().slice(0,7),calMonth=today().slice(0,7);
let semesterId='',courseFilter='';
function migrateUniversity(){
  if(!state.semesters.length&&state.university.length){
    const sem={
      id:uid(),title:'Previous assessments'
    };
    state.semesters.push(sem);
    for(const a of state.university){
      let c=state.courses.find(c=>c.semesterId===sem.id&&c.title===a.course);
      if(!c){
        c={
          id:uid(),semesterId:sem.id,title:a.course||'Unnamed course'
        };
        state.courses.push(c)
      }
      a.courseId=c.id;
      a.semesterId=sem.id
    }
  }
  if(!state.semesters.some(s=>s.id===semesterId))semesterId=state.semesters.at(-1)?.id||'';
  if(!state.courses.some(c=>c.id===courseFilter&&c.semesterId===semesterId))courseFilter=''
}
migrateUniversity();
const sections=[['Home','⌂','Your daily overview'],['University','🎓','Grades, exams & assignments'],['Work','▤','Tasks & follow-ups'],['Calendar','▦','Schedule & deadlines'],['Finances','$','Income, expenses & projections'],['Vehicle','🚘','Maintenance & mileage'],['Knowledge Base','▧','Notes & procedures'],['Quick Links','↗','Frequently visited websites'],['Settings','⚙','Preferences & appearance']];
function save(){
  if(!cloudReady || !cloudSave){notify('Cloud not connected. Changes are not saved.');return;}
  cloudSave(JSON.parse(JSON.stringify(state)));
}
function notify(s){
  $('toast').textContent=s;
  $('toast').style.display='block';
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>$('toast').style.display='none',3500)
}
function go(p){
  page=p;
  edit=null;
  render();
  if(p==='Calendar'&&!googleRestoring){if(googleToken)googleRefresh();else googleRestore();}
}
function render(){
  document.body.classList.toggle('dark',state.theme==='dark');
  $('heading').textContent=page==='Home'?'Overview':page;
  $('today').textContent=new Date().toLocaleDateString('en-CA',{
    weekday:'long',month:'long',day:'numeric',year:'numeric'
  });

function easternParts(d){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:calendarZone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));

}

function easternInstant(value){
  const wanted=Date.parse(value.length===16?value+':00Z':value+'Z');
  if(!Number.isFinite(wanted))throw Error('Invalid date or time.');
  let guess=wanted;
  for(let i=0;i<4;i++){
    const p=easternParts(new Date(guess));
    const diff=wanted-Date.parse(p.date+'T'+p.time+':00Z');
    if(!diff)return new Date(guess).toISOString();
    guess+=diff;
  }
  throw Error('That local time does not exist in Toronto. Choose a different time.');
}

      item.column=column;ends[column]=item.end;
    }
    for(const item of group){
      item.columns=ends.length;
      for(let col=item.column+1;col<ends.length;col++){
        if(group.some(other=>other.column===col&&other.start<item.end&&other.end>item.start))break;

  }
  if(key==='courses'&&state.university.some(a=>a.courseId===id)){
    notify('Delete assessments in this course before deleting it.');
    return
  }
  const overlay=document.createElement('div');
  overlay.className='delete-overlay';
  overlay.innerHTML=`<section class="card delete-box" role="alertdialog" aria-modal="true" aria-label="Confirm deletion"><h2>Delete entry?</h2><p>${esc(item.title||item.course||'This entry')} will be removed.${item.repeat&&item.repeat!=='Once'?' All occurrences of this recurring transaction will be removed.':''}</p><div class="actions"><button type="button" class="secondary" data-no>Cancel</button><button type="button" class="danger" data-yes>Delete</button></div></section>`;
  document.body.append(overlay);
  const close=()=>{
    overlay.remove();
    document.removeEventListener('keydown',onKey)
  };
  const onKey=e=>{
    if(e.key==='Escape')close()
  };
  document.addEventListener('keydown',onKey);
  overlay.querySelector('[data-no]').onclick=close;
  overlay.querySelector('[data-yes]').onclick=()=>{
    state[key]=state[key].filter(a=>String(a.id)!==id);
    edit=null;
    close();
    save();
    render();
    notify(storageOK?'Entry deleted':'Deleted for this session only — export a backup.')
  };
  overlay.querySelector('[data-no]').focus()
}
function bind(){
  const root=$('content');
  root.oninput=e=>{
    if(e.target.name==='linkQuery'){
      linkQuery=e.target.value;
      $('linkRows').innerHTML=linkRows()
    }
  };
  if(page==='Calendar'){
    clockLine();
    const gf=document.getElementById('googleEventForm');if(gf)gf.onsubmit=e=>{e.preventDefault();googleAction('save');};
  }
  root.onchange=e=>{
    const el=e.target;
    if(['workFilter','txFrom','txTo','txCategory','linkCategory'].includes(el.name)){
      if(el.name==='workFilter')workFilter=el.value;
      if(el.name==='txFrom')txFrom=el.value;
      if(el.name==='txTo')txTo=el.value;
      if(el.name==='txCategory')txCategory=el.value;
      if(el.name==='linkCategory')linkCategory=el.value;
      render();
      return
    }
    if(el.name==='googleVisible'){if(el.checked)googleVisible.add(el.value);else googleVisible.delete(el.value);googleStore();render();return;}
    if(el.name==='activeSemester'){
      semesterId=el.value;
      courseFilter='';
      edit=null;
      render();
      return
    }
    if(el.name==='courseFilter'){
      courseFilter=el.value;
      render();
      return
    }
    if(!el.matches('[data-work-status]'))return;
    const task=state.work.find(a=>String(a.id)===el.dataset.workStatus);
    if(task){
      task.status=el.value;
      save();
      render();
      notify(storageOK?'Status updated':'Status updated for this session only')
    }
  };
  root.onclick=e=>{
    const b=e.target.closest('button');
    if(!b)return;
    if(b.dataset.go)go(b.dataset.go);
    if(b.dataset.edit){
      const [key,id]=b.dataset.edit.split(':');
      edit={
        key,id
      };
      render();
      window.scrollTo(0,0)
    }
    if(b.dataset.delete){
      const [key,id]=b.dataset.delete.split(':');
      showDelete(key,id)
    }
    if(b.hasAttribute('data-cancel')){
      edit=null;
      render()
    }
    if(b.hasAttribute('data-google-details')){calendarDetails(Number(b.dataset.googleDetails));return;}
    if(b.dataset.googleAction){googleAction(b.dataset.googleAction,b.dataset.googleIndex);return;}
    if(b.dataset.cal){
      calAnchor=b.dataset.cal==='today'?easternToday():calView==='Week'?shiftDay(calAnchor,7*Number(b.dataset.cal)):addMonths(calAnchor,Number(b.dataset.cal));
      calMonth=calAnchor.slice(0,7);
      render();if(googleToken)googleRefresh()
    }
    if(b.dataset.calView){
      calView=b.dataset.calView;
      render();if(googleToken)googleRefresh()
    }
    if(b.hasAttribute('data-clear-tx')){
      txFrom='';
      txTo='';
      txCategory='All';
      render()
    }
    if(b.hasAttribute('data-clear-links')){
      linkCategory='All';
      linkQuery='';
      render()
    }
  };
  root.querySelectorAll('form[data-form]').forEach(f=>{
    const submit=e=>{
      e.preventDefault();
      const error=f.querySelector(".form-error");
      error.hidden=true;
      try{
        for(const input of f.elements){
          if(!input.name)continue;
          if(input.required&&!String(input.value).trim()){
            input.focus();
            throw Error("Please enter "+input.closest("label").firstChild.textContent.trim()+".")
          }
          if(!input.checkValidity()&&input.validity.typeMismatch){
            input.focus();
            throw Error("Please enter a valid "+input.closest("label").firstChild.textContent.trim()+".")
          }
        }
        let key=f.dataset.form,a=Object.fromEntries(new FormData(f));
        if(key==='semesters'&&state.semesters.some(s=>s.title.toLowerCase()===a.title.trim().toLowerCase()&&s.id!==edit?.id))throw Error('This semester already exists.');
        if(key==='courses'){
          a.finalWeight=parseAmount(a.finalWeight);
          if(a.finalWeight<0||a.finalWeight>100)throw Error('Final exam weight must be between 0 and 100.');
          const previous=state.courses.find(c=>c.id===edit?.id);
          a.finalGrade=previous?.finalGrade??null;
          if(sum(state.university.filter(x=>x.courseId===edit?.id).map(x=>x.weight))+a.finalWeight>100.00001)throw Error('Assessment weights plus final exam weight cannot exceed 100%.');
          a.semesterId=semesterId;
          if(state.courses.some(c=>c.semesterId===semesterId&&c.title.toLowerCase()===a.title.trim().toLowerCase()&&c.id!==edit?.id))throw Error('This course already exists in this semester.')
        }
        if(key==='university'){
          const c=state.courses.find(c=>c.id===a.courseId&&c.semesterId===semesterId);
          if(!c)throw Error('Select a course.');
          a.course=c.title;
          a.semesterId=semesterId;
        }
        if(key==='transactions'&&!a.title.trim())a.title=a.category==='Other'?a.type:a.category;
        for(const k of ['amount','mileage','weight','grade'])if(k in a)a[k]=k==='grade'&&a[k].trim()===''?null:parseAmount(a[k]);
        if(key==='transactions'&&(a.amount<=0||a.end&&a.end<a.date))throw Error('Enter a positive amount and an end date on or after the start date.');
        if(key==='university'&&(a.weight<0||a.weight>100||a.grade!==null&&(a.grade<0||a.grade>100)))throw Error('Grades and weights must be between 0 and 100.');
        if(key==='university'&&sum(state.university.filter(x=>x.courseId===a.courseId&&x.id!==edit?.id).map(x=>x.weight))+a.weight+Number(state.courses.find(c=>c.id===a.courseId)?.finalWeight??0)>100.00001)throw Error('Assessment weights plus final exam weight cannot exceed 100%. Enter the final exam separately in course settings.');
        if(key==='vehicle'&&(!Number.isInteger(a.mileage)||a.mileage<0||a.amount<0))throw Error('Enter a whole nonnegative mileage and valid cost.');
        if(key==='links'&&!safeURL(a.url))throw Error('Enter an HTTP or HTTPS website URL.');
        if(edit?.key===key){
          a.id=edit.id;
          state[key]=state[key].map(x=>x.id===a.id?a:x)
        } else{
          a.id=uid();
          state[key].push(a)
        }
        if(key==='semesters'){
          semesterId=a.id;
          courseFilter=''
        }
        if(key==='courses'){
          state.university.filter(x=>x.courseId===a.id).forEach(x=>x.course=a.title)
        }
        edit=null;
        if(key==='calendar'){
          calMonth=a.date.slice(0,7);
          calAnchor=a.date;
        }
        if(key==='transactions')month=a.date.slice(0,7);
        save();
        render();
        notify(storageOK?'Saved successfully':'Added for this session only — export a backup.')
      } catch(err){
        error.textContent=err.message;
        error.hidden=false;
        notify(err.message)
      }
    };
    f.onsubmit=submit;
    f.querySelector('[data-save-form]').onclick=submit;
  });
  const fm=root.querySelector('[name=financeMonth]');
  if(fm)fm.onchange=()=>{
    if(fm.value){
      month=fm.value;
      render()
    }
  };
  if($('horizon'))$('horizon').onchange=e=>{
    state.projection=Number(e.target.value);
    save();
    render()
  };
  if($('noteSearch'))$('noteSearch').oninput=e=>$('noteList').innerHTML=notesHTML(e.target.value);
  if($('settingsForm'))$('settingsForm').onsubmit=e=>{
    e.preventDefault();
    try{
      const f=new FormData(e.target),o=parseAmount(f.get('opening')),b=parseAmount(f.get('budget'));
      if(b<0||b>100)throw Error('Savings target must be 0–100%.');
      state.opening=o;
      state.budget=b;
      state.theme=f.get('theme');
      save();
      render();
      notify('Preferences saved')
    } catch(err){
      notify(err.message)
    }
  };
  if($('export'))$('export').onclick=()=>download('my-life-backup.json',JSON.stringify(state,null,2),'application/json');
  if($('csv'))$('csv').onclick=()=>{
    const keys=['date','type','title','category','amount','repeat','end'],quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
    download('finance.csv',[keys.join(','),...state.transactions.map(a=>keys.map(k=>quote(a[k])).join(','))].join('\r\n'),'text/csv')
  };
  if($('reset'))$('reset').onclick=()=>{
    if(confirm('Permanently delete all dashboard data from your cloud account and synced devices?')){
      state=defaults();
      save();
      go('Home')
    }
  };
  if($('import')){
    $('import').onclick=()=>$('importFile').click();
    $('importFile').onchange=async e=>{
      try{
        const data=JSON.parse(await e.target.files[0].text()),base=defaults();
        for(const k of Object.keys(base).filter(k=>Array.isArray(base[k])))if((['semesters','courses'].includes(k)&&data[k]===undefined)?false:!Array.isArray(data[k])||data[k].some(a=>!a||typeof a.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(a.id)))throw Error('Invalid backup file.');
        if(!Number.isFinite(data.opening)||!Number.isFinite(data.budget)||data.budget<0||data.budget>100||![3,6,12,24,60,120].includes(data.projection)||!['light','dark'].includes(data.theme))throw Error('Invalid backup preferences.');
        if(data.transactions.some(a=>!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!Number.isFinite(a.amount)||a.amount<=0||!['Once','Weekly','Biweekly','Monthly','Yearly'].includes(a.repeat)||!['Income','Expense'].includes(a.type)))throw Error('Invalid transaction records.');
        if(confirm('Replace all current dashboard data with this backup?')){
          state={
            ...base,...data
          };
          semesterId='';
          courseFilter='';
          migrateUniversity();
          save();
          go('Home')
        }
      } catch(err){
        notify(err.message)
      }
    }
  }
}
setInterval(()=>{if(cloudReady && page==='Calendar')clockLine()},15000);
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDocFromServer, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const gate=$('authGate'), message=$('authMessage'), login=$('googleLogin'), status=$('cloudStatus');
let unsubscribe=null,generation=0,pending=0,failed=false,queue=Promise.resolve(),lastRemote=null;
function lock(msg){
  googleDisconnect(false);
  cloudReady=false;cloudSave=null;
  document.body.classList.remove('authenticated');
  gate.hidden=false;message.textContent=msg;
  $('content').replaceChildren();$('nav').replaceChildren();
  state=defaults();edit=null;semesterId='';courseFilter='';
}
try{
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
  login.disabled=false;
  login.onclick=async()=>{
    login.disabled=true;message.textContent='Opening Google sign-in…';
    try{await signInWithPopup(auth,new GoogleAuthProvider());}
    catch(e){message.textContent='Sign-in failed: '+e.message;login.disabled=false;}
  };
  $('cloudLogout').onclick=async()=>{
    if(pending||failed){notify('Cloud save pending or failed. Export a backup before leaving.');return;}
    try{googleDisconnect();googleForget();await signOut(auth)}catch(e){notify(e.message)}
  };
  $('gateLogout').onclick=()=>{googleDisconnect();googleForget();return signOut(auth).catch(e=>{message.textContent=e.message;});};
  onAuthStateChanged(auth,async user=>{
    const session=++generation;
    if(unsubscribe){unsubscribe();unsubscribe=null;}
    lock(user?'Checking private database access…':'Sign in to continue.');
    login.hidden=!!user;login.disabled=!!user;$('gateLogout').hidden=!user;
    if(!user){if(googleOwner)googleForget();googleOwner='';googleAccountHint='';return;}
    googleOwner=user.uid;googleAccountHint=user.email||'';
    const ref=doc(db,'users',user.uid,'dashboard','state');
    try{
      const snapshot=await getDocFromServer(ref);
      if(session!==generation)return;
      if(snapshot.exists()){
        const remote=snapshot.data().state;
        if(!remote||typeof remote!=='object')throw Error('Invalid cloud data.');
        state={...defaults(),...remote};
      }else{
        await setDoc(ref,{state:defaults()});
        if(session!==generation)return;
      }
      lastRemote=JSON.stringify(state);
      migrateUniversity();page='Home';pending=0;failed=false;queue=Promise.resolve();
      cloudReady=true;
      cloudSave=data=>{
        pending++;status.textContent='Saving to cloud…';
        queue=queue.catch(()=>{}).then(async()=>{
          if(session!==generation)return;
          try{await setDoc(ref,{state:data});if(session===generation){failed=false;lastRemote=JSON.stringify(data);}}
          catch(e){if(session===generation){failed=true;notify('Cloud save failed. Export a backup in Settings.');}}
          finally{if(session===generation){pending--;status.textContent=failed?'Save failed — export backup':pending?'Saving to cloud…':'Saved to cloud';}}
        });
      };
      gate.hidden=true;document.body.classList.add('authenticated');status.textContent='Cloud connected';render();googleRestore();
      try{
        const raw=localStorage.getItem('myLifeDashboard.v1');
        $('oldBackup').hidden=!raw;
        $('oldBackup').onclick=()=>download('my-life-local-backup.json',raw,'application/json');
      }catch(e){}
      unsubscribe=onSnapshot(ref,{includeMetadataChanges:true},snap=>{
        if(session!==generation||!snap.exists()||snap.metadata.hasPendingWrites||snap.metadata.fromCache||pending||failed)return;
        const remote=snap.data().state;if(!remote||typeof remote!=='object')return;
        const json=JSON.stringify(remote);if(json===lastRemote)return;
        lastRemote=json;state={...defaults(),...remote};migrateUniversity();edit=null;render();status.textContent='Synced from cloud';
      },e=>{if(session===generation)status.textContent='Live sync unavailable: '+e.code;});
    }catch(e){
      if(session!==generation)return;
      lock('Access denied or database unavailable. Check your Firestore rules and authorized Google account. ('+(e.code||e.message)+')');
    }
  });
}catch(e){message.textContent='Firebase setup error: '+e.message;}

</script>
